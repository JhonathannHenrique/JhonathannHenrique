<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Linguagens mais usadas">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #3fb950; }
  .label { font-size: 13px; fill: #e6edf3; }
  .value { font-size: 13px; font-weight: 700; fill: #e6edf3; }
  .muted { font-size: 12px; fill: #9198a1; }
  .row { animation: fade .5s ease-out backwards; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow .9s ease-out .2s backwards; }
  @keyframes fade { from { opacity: 0; transform: translateX(-6px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .row, .bar { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="419" height="199" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="34" class="title">Linguagens mais usadas</text>
<clipPath id="r"><rect x="24" y="50" width="372" height="10" rx="5"/></clipPath>
<rect x="24" y="50" width="372" height="10" rx="5" fill="#21262d"/>
